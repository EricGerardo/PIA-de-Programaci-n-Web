<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Lato&family=Playfair+Display:wght@600&display=swap"
        rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>Iniciar sesión | Un ramo más</title>
</head>

<body>
    <a class="visually-hidden-focusable" href="#contenido">Saltar al contenido</a>
    <header>
        <nav class="navbar border-bottom" aria-label="Principal">
            <div class="container"><a class="navbar-brand fs-3" href="index.html">🌸 Un ramo más</a>
                <div class="d-flex gap-2"><a class="btn btn-outline-secondary btn-sm" href="iniciar-sesion.html">Iniciar
                        sesión</a><a class="btn btn-rosa btn-sm" href="crear-cuenta.html">Crear cuenta</a></div>
            </div>
        </nav>
    </header>
    <main id="contenido" class="container mt-5">
        <div class="card auth mx-auto p-4">
            <h1 class="h3 mb-4">Iniciar sesión</h1>
            <form id="f" action="home-cliente.html" method="get">
                <div class="mb-3"><label for="correo" class="form-label">Correo electrónico</label><input id="correo"
                        name="correo" type="email" class="form-control" required></div>
                <div class="mb-3"><label for="clave" class="form-label">Contraseña</label><input id="clave" name="clave"
                        type="password" class="form-control" required></div>
                <div class="mb-3"><label for="rol" class="form-label">Entrar como (solo prototipo)</label><select
                        id="rol" class="form-select">
                        <option value="home-cliente.html">Cliente</option>
                        <option value="home-empleado.html">Empleado</option>
                        <option value="home-admin.html">Admin</option>
                    </select></div><button class="btn btn-rosa w-100" type="submit">Iniciar sesión</button>
            </form>
            <p class="small text-center mt-3 mb-0">¿No tienes cuenta? <a class="link-rosa"
                    href="crear-cuenta.html">Crear cuenta</a></p>
        </div>
    </main>
    <footer class="border-top text-center py-3 mt-5 small">© 2026 Un ramo más · Prototipo</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="js/iniciar-sesion.js"></script>
</body>

</html>
