<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Lato&family=Playfair+Display:wght@600&display=swap"
        rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>Clientes | Un ramo más</title>
</head>

<body data-roles="empleado,administrador" data-tipo="cliente">
    <a class="visually-hidden-focusable" href="#contenido">Saltar al contenido</a>
    <header class="navbar border-bottom px-3"><a class="navbar-brand fs-4" href="home-empleado.html">🌸 Un ramo más ·
            Empleado</a>
        <div class="d-flex align-items-center gap-2"><span class="fw-bold">Empleado</span><a
                class="btn btn-outline-secondary btn-sm" href="home-empleado.html">Ir a la tienda</a><a
                class="btn btn-outline-secondary btn-sm" href="index.html">Salir</a></div>
    </header>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 sidebar p-3">
                <nav aria-label="Panel">
                    <ul class="nav nav-pills flex-md-column gap-1">
                        <li class="nav-item"><a class="nav-link" href="panel-empleado.html">Resumen</a></li>
                        <li class="nav-item"><a class="nav-link" href="crud-pedidos-emp.html">Pedidos</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page"
                                href="crud-clientes-emp.html">Clientes</a></li>
                        <li class="nav-item"><a class="nav-link" href="crud-direcciones-emp.html">Direcciones</a>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="crud-proveedores-emp.html">Proveedores</a>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="crud-inventario-emp.html">Inventario y
                                diseños</a></li>
                    </ul>
                </nav>
            </aside>
            <main id="contenido" class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                    <h1 class="h2 mb-0">Clientes <span class="badge text-bg-secondary fs-6">Solo lectura</span></h1>
                </div>
                <div class="mb-3"><label for="buscar" class="visually-hidden">Buscar en clientes</label><input
                        id="buscar" type="search" class="form-control" placeholder="Buscar en clientes"></div>
                <div class="table-responsive">
                    <table id="tabla" class="table table-hover align-middle">
                        <caption class="visually-hidden">Clientes</caption>
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Correo</th>
                                <th scope="col">Teléfono</th>
                                <th scope="col">Registro</th>
                                <th scope="col">Direcciones</th>
                                <th scope="col">Pedidos</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="js/comun.js"></script>
    <script src="js/crud.js"></script>
    <script src="js/usuarios.js"></script>
</body>

</html>
