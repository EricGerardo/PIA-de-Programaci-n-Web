<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Lato&family=Playfair+Display:wght@600&display=swap"
        rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>Carrito | Un ramo más</title>
</head>

<body data-roles="cliente,empleado,administrador">
    <a class="visually-hidden-focusable" href="#contenido">Saltar al contenido</a>
    <header>
        <nav class="navbar border-bottom" aria-label="Principal">
            <div class="container"><a class="navbar-brand fs-3" id="inicio" href="home-cliente.html">🌸 Un ramo más</a>
                <div class="d-flex align-items-center gap-3"><span class="fw-bold" id="rol-n">Cliente</span><a
                        class="btn btn-outline-secondary btn-sm" id="cat" href="catalogo-cliente.html">Catálogo</a>
                </div>
            </div>
        </nav>
    </header>
    <main id="contenido" class="container mt-4">
        <h1 class="mb-4">Tu carrito</h1>
        <div class="table-responsive">
            <table class="table align-middle">
                <caption class="visually-hidden">Ramos en el carrito</caption>
                <thead>
                    <tr>
                        <th scope="col">Ramo</th>
                        <th scope="col">Precio</th>
                        <th scope="col">Cantidad</th>
                        <th scope="col">Subtotal</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="items"></tbody>
            </table>
        </div>
        <p id="vacio" class="text-muted d-none">Tu carrito está vacío. Agrega ramos desde el catálogo.</p>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3"><a
                class="btn btn-outline-secondary" id="seguir" href="catalogo-cliente.html">Seguir comprando</a>
            <div class="text-end">
                <p class="h4 mb-2">Total: <span class="precio" id="total"></span></p><a class="btn btn-rosa" id="pagar"
                    href="pago.html">Proceder al pago</a>
            </div>
        </div>
    </main>
    <footer class="border-top text-center py-3 mt-5 small">© 2026 Un ramo más · Prototipo</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="js/comun.js"></script>
    <script src="js/carrito.js"></script>
</body>

</html>
