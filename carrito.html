<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Lato&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<title>Carrito | Un ramo más</title>
</head>
<body>
<a class="visually-hidden-focusable" href="#contenido">Saltar al contenido</a>
<header><nav class="navbar border-bottom" aria-label="Principal"><div class="container"><a class="navbar-brand fs-3" id="inicio" href="home-cliente.html">🌸 Un ramo más</a><div class="d-flex align-items-center gap-3"><span class="fw-bold" id="rol-n">Cliente</span><a class="btn btn-outline-secondary btn-sm" id="cat" href="catalogo-cliente.html">Catálogo</a></div></div></nav></header>
<main id="contenido" class="container mt-4"><h1 class="mb-4">Tu carrito</h1><div class="table-responsive"><table class="table align-middle"><caption class="visually-hidden">Ramos en el carrito</caption><thead><tr><th scope="col">Ramo</th><th scope="col">Precio</th><th scope="col">Cantidad</th><th scope="col">Subtotal</th><th scope="col">Acciones</th></tr></thead><tbody id="items"><tr data-p="450"><td>🌹 Rosas Clásicas</td><td>$450</td><td><input type="number" min="1" value="1" class="form-control form-control-sm cant" aria-label="Cantidad" style="width:5rem"></td><td class="sub"></td><td><button class="btn btn-sm btn-outline-danger quitar" type="button">Eliminar</button></td></tr><tr data-p="520"><td>💐 Ramo Mixto Aurora</td><td>$520</td><td><input type="number" min="1" value="2" class="form-control form-control-sm cant" aria-label="Cantidad" style="width:5rem"></td><td class="sub"></td><td><button class="btn btn-sm btn-outline-danger quitar" type="button">Eliminar</button></td></tr></tbody></table></div><p id="vacio" class="text-muted d-none">Tu carrito está vacío. Agrega ramos desde el catálogo.</p><div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3"><a class="btn btn-outline-secondary" id="seguir" href="catalogo-cliente.html">Seguir comprando</a><div class="text-end"><p class="h4 mb-2">Total: <span class="precio" id="total"></span></p><a class="btn btn-rosa" id="pagar" href="pago.html">Proceder al pago</a></div></div></main>
<footer class="border-top text-center py-3 mt-5 small">© 2026 Un ramo más · Prototipo</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
<script>var r="cliente";try{r=sessionStorage.getItem("rol")||r}catch(e){}
var N={cliente:"Cliente",empleado:"Empleado",admin:"Admin"};document.getElementById("rol-n").textContent=N[r];
document.getElementById("inicio").href="home-"+r+".html";document.getElementById("cat").href=document.getElementById("seguir").href="catalogo-"+r+".html";
function calc(){var t=0,rs=document.querySelectorAll("#items tr");rs.forEach(function(x){var s=x.dataset.p*Math.max(1,x.querySelector(".cant").value);x.querySelector(".sub").textContent="$"+s;t+=s});
var it=[];rs.forEach(function(x){it.push({n:x.cells[0].textContent,p:+x.dataset.p,c:Math.max(1,+x.querySelector(".cant").value)})});try{sessionStorage.setItem("carrito",JSON.stringify(it))}catch(e){}document.getElementById("pagar").classList.toggle("disabled",rs.length==0);document.getElementById("total").textContent="$"+t+" MXN";document.getElementById("vacio").classList.toggle("d-none",rs.length>0)}
document.getElementById("items").addEventListener("input",calc);document.getElementById("items").addEventListener("click",function(e){if(e.target.classList.contains("quitar")){e.target.closest("tr").remove();calc()}});calc();</script>
</body>
</html>
